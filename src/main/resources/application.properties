# Configuración del Servidor y Base de Datos PostgreSQL
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/operaciones_db
spring.datasource.username=postgres
spring.datasource.password=nico2806

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Flyway (Migraciones)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair=true

# Configuración de Camunda para Spring Boot
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.first-name=Admin
camunda.bpm.admin-user.last-name=Sistema
camunda.bpm.admin-user.email=admin@entidad.com
